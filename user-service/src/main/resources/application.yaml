spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/user_database
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8090
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true