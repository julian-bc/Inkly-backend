services:
  ### CONFIGURATION MICROSERVICES
  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    container_name: config-server
    ports:
      - "${CONFIG_SERVER_PORT}:${CONFIG_SERVER_PORT}"
    env_file:
      - ./.env.prod

  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "${DISCOVERY_SERVER_PORT}:${DISCOVERY_SERVER_PORT}"
    depends_on:
      - config-server
    env_file:
      - ./.env.prod

  api_gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      - config-server
      - eureka-server
    env_file:
      - ./.env.prod

  ### BUSINESS MICROSERVICES

  notification_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_FOLDER: notification-service
    container_name: notification-service
    depends_on:
      - config-server
      - eureka-server
    env_file:
      - ./.env.prod

  user_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_FOLDER: user-service
    container_name: user-service
    depends_on:
      - config-server
      - eureka-server
    env_file:
      - ./.env.prod

  verification_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_FOLDER: verification-service
    container_name: verification-service
    depends_on:
      - config-server
      - eureka-server
    env_file:
      - ./.env.prod

  view_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_FOLDER: view-service
    container_name: view-service
    depends_on:
      - config-server
      - eureka-server
    env_file:
      - ./.env.prod